[package]
name = "rustkit-media"
version = "0.1.0"
edition = "2021"
description = "HTML5 Audio/Video element support for RustKit browser engine"
authors = ["HiWave Team"]
license = "AGPL-3.0-or-later"

[features]
# MEDIA-AVF step 3: the main-thread MediaHost with real AVPlayers (`avf_host`). Off by
# default until Milestone 1 step 6.
media-avf = []

[dependencies]
# RustKit crates
rustkit-dom = { path = "../rustkit-dom" }
rustkit-common = { path = "../rustkit-common" }

# Core
bytes = "1"
thiserror = "1.0"
tracing = "0.1"
url = "2.5"

# Async
tokio = { version = "1.42", features = ["sync", "time"] }

# Collections
hashbrown = "0.14"

# MEDIA-AVF (docs/design/MEDIA_AVF.md §2, approved 2026-11-18): AVFoundation through the
# objc2 bindings. Only the features the design calls are enabled. AVPlayer outputs its own
# audio, so the unused `rodio` dependency is gone.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject", "NSURL", "NSArray", "NSData", "NSValue", "NSError", "NSDictionary"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime", "CMTimeRange"] }
# Step 3: a frame's CVPixelBuffer, locked and read (§3.3). Already in the lock through
# objc2-av-foundation.
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVReturn", "CVPixelBuffer"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "AVAsset",
    "AVAssetTrack",
    "AVAsynchronousKeyValueLoading",
    "AVMediaFormat",
    "AVAssetResourceLoader",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerItemOutput",
    "AVTime",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video",
] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"


# The real MediaHost needs a main thread whose main queue drains (§3.2): this test's own
# `main` runs the run loop, so it has no libtest harness.
[[test]]
name = "media_host"
harness = false
required-features = ["media-avf"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }
