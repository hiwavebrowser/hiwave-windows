[package]
name = "rustkit-text"
version = "0.1.0"
edition = "2021"
description = "Text shaping and font access for RustKit (platform-specific)"
authors = ["HiWave Team"]
license = "AGPL-3.0-or-later"

[dependencies]
thiserror = "1.0"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_DirectWrite",
    "Win32_System_Registry",
    # icu.dll's u_hasBinaryProperty, loaded at run time (Emoji_Presentation).
    "Win32_System_LibraryLoader",
] }
# The `#[implement]` macro (the web-font registry's own font file loader) names this crate.
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "20.1"
core-graphics = "0.23"
core-foundation = "0.9"
foreign-types-shared = "0.3"

# Linux: the web-font registry opens the faces it installs as FreeType memory faces (webfonts.rs).
[target.'cfg(target_os = "linux")'.dependencies]
freetype-rs = "0.35"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


