[package]
name = "rustkit-engine"
version = "0.1.0"
edition = "2021"
description = "Browser engine orchestration layer for RustKit"
authors = ["HiWave Team"]
license = "MIT"

[features]
default = []
# Headless mode: Enables offscreen rendering without window surfaces
# Useful for testing, CI/CD, and server-side rendering
headless = []

[dependencies]
# RustKit crates
rustkit-viewhost = { path = "../rustkit-viewhost" }
rustkit-compositor = { path = "../rustkit-compositor" }
rustkit-core = { path = "../rustkit-core" }
rustkit-dom = { path = "../rustkit-dom" }
rustkit-css = { path = "../rustkit-css" }
rustkit-layout = { path = "../rustkit-layout" }
rustkit-js = { path = "../rustkit-js" }
rustkit-bindings = { path = "../rustkit-bindings" }
rustkit-net = { path = "../rustkit-net" }
rustkit-image = { path = "../rustkit-image" }
rustkit-svg = { path = "../rustkit-svg" }
rustkit-renderer = { path = "../rustkit-renderer" }

# Async runtime
tokio = { version = "1.42", features = ["sync", "time", "rt"] }
futures = "0.3"

# URL handling
url = "2.5"

# Script-network bridge (script_net.rs): request/response types
http = "1.2"
bytes = "1.9"

# data: URI payloads (@font-face src)
base64 = "0.22"

# Error handling
thiserror = "1.0"

# Tracing
tracing = "0.1"

# JSON serialization
serde_json = "1.0"

# Windows (conditional)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }

# tests/macos_live_click.rs makes a real NSWindow and sends it NSEvents.
[target.'cfg(target_os = "macos")'.dev-dependencies]
cocoa = "0.25"
objc = "0.2"
raw-window-handle = "0.6"

# Makes an NSWindow, which AppKit only allows on the main thread, so it runs
# without the test harness.
[[test]]
name = "macos_live_click"
harness = false

