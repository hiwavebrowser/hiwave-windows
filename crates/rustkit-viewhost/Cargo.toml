[package]
name = "rustkit-viewhost"
version = "0.1.0"
edition = "2021"
description = "Platform ViewHost layer for RustKit browser engine"
authors = ["HiWave Team"]
license = "MIT"

[dependencies]
# RustKit core (for input event types)
rustkit-core = { path = "../rustkit-core" }

# Error handling
thiserror = "1.0"

# Tracing
tracing = "0.1"

# Screenshot support (Windows GPU readback -> PNG)
png = "0.17"

# Windows API bindings (conditional)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# macOS dependencies (conditional)
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
core-foundation = "0.9"
objc = "0.2"
objc2 = "0.5"
raw-window-handle = "0.6"

# The window loop hiwave-app runs, for the wheel test.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tao = { workspace = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Makes an NSWindow, which AppKit only allows on the main thread, so it runs
# without the test harness.
[[test]]
name = "macos_set_bounds"
harness = false

[[test]]
name = "macos_click_point"
harness = false

[[test]]
name = "macos_key_events"
harness = false

[[test]]
name = "macos_pointer_moves"
harness = false

# Runs a tao event loop, which must own the main thread.
[[test]]
name = "macos_wheel_recorded"
harness = false
