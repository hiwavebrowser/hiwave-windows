name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation buys nothing on throwaway CI checkouts and
  # bloats the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Build & test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build hiwave-app (release, default features)
        run: cargo build --release -p hiwave-app

      - name: Test workspace
        run: cargo test --workspace

      - name: Check native-win32 mode compiles
        # The experimental 100% RustKit mode regresses silently when
        # main.rs gains an unconditional wry/tao import — check it
        # every commit, don't wait for someone to launch it.
        run: cargo check -p hiwave-app --no-default-features --features native-win32
