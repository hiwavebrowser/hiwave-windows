name: Windows Metrics

# hiwave-windows had NO workflows at all -- zero CI, zero collected metrics,
# no metrics-history branch -- while hiwave-macos has collected parity metrics
# on every push for months. This is the Windows counterpart.
#
# It deliberately does NOT port hiwave-macos's parity pixel-diff metric.
# That harness needs a real GPU adapter, and when capture yields nothing it
# defaults each case to 100.0 rather than erroring, so a hosted Windows runner
# would publish a confident-looking "100% diff" that measures the runner, not
# the renderer. Build and test results are what a headless Windows box can
# honestly report, so those are what this collects.

on:
  # master via push, everything else via the PR event. `branches: ['**']` plus
  # `pull_request` ran this job TWICE on the same SHA for every PR push -- two
  # runner slots and two CI notices per commit for one measurement. The
  # master-gated "Update metrics history" step still fires, because master
  # pushes are still push events.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: never
  # WORKFLOW scope, deliberately. A step's own `env:` block is NOT visible to
  # that same step's `if:` -- the condition is evaluated before step env is
  # built -- so the step-local form looks correct in review and is completely
  # inert in production. (Atlas hit this on macOS and flagged it before anyone
  # else could ship it the broken way.)
  UMBRELLA_PAT: ${{ secrets.UMBRELLA_PAT }}

jobs:
  collect-metrics:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Collect metrics
        shell: bash
        run: |
          python scripts/collect_metrics.py \
            --output metrics.json \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

      - name: Job summary
        shell: bash
        run: |
          python scripts/collect_metrics.py \
            --input metrics.json --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-metrics-${{ github.sha }}
          path: metrics.json
          retention-days: 90

      # Fail the job AFTER the metrics are recorded, so a red build still
      # produces a data point instead of losing the run entirely.
      - name: Enforce build and tests
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("metrics.json", encoding="utf-8"))
          bad = []
          if not m["build"]["ok"]:
              bad.append(f"build exit {m['build']['exit_code']}")
          if m["tests"]["failed"]:
              bad.append(f"{m['tests']['failed']} test(s) failed")
          # E1: a crashed suite reports failed == 0 because the counts only
          # cover binaries that finished. On 2026-07-30 master run fda40ab
          # died with 0xC0000005 at 260 tests and this step published it as a
          # green row. tests.ok is cargo's own exit status - the only signal
          # that the suite RAN TO COMPLETION.
          if not m["tests"]["ok"]:
              bad.append(
                  f"test suite did not complete (cargo exit "
                  f"{m['tests']['exit_code']}) - counts are partial"
              )
          if bad:
              print("FAIL: " + "; ".join(bad))
              sys.exit(1)
          print(f"OK: {m['tests']['passed']} tests passed, suite complete")
          PY

      # Runs on EVERY branch so the logic is actually exercised in review; only
      # the final push is master-gated. The previous version gated the whole
      # step on master, which meant no PR could ever execute it — so it shipped
      # broken and went red on its first real run. A step that cannot run in
      # review is unreviewable by construction.
      - name: Update metrics history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep the metrics file across the branch switch, then REMOVE it from
          # the working tree. It is untracked here but TRACKED on
          # metrics-history, so leaving it in place makes `git checkout
          # metrics-history` refuse ("untracked working tree files would be
          # overwritten"). `git checkout -- .` does not help: it only discards
          # modifications to TRACKED files.
          #
          # That refusal was previously swallowed by 2>/dev/null and fell
          # through to `--orphan`, which then died with "a branch named
          # 'metrics-history' already exists" because the fetch had just
          # created it. The old comment here predicted that cascade and the
          # code still hit it, because this step only runs on master and so
          # never executed in PR review. First master run after the branch
          # existed: red.
          cp metrics.json "$RUNNER_TEMP/metrics.json"
          rm -f metrics.json
          git checkout -- .

          # Point the local branch at the remote if it exists, else start an
          # orphan. `checkout -B <b> origin/<b>` is idempotent and cannot trip
          # the "already exists" error the previous fetch-then-checkout could.
          if git fetch origin metrics-history 2>/dev/null; then
            git checkout -B metrics-history origin/metrics-history
          else
            git checkout --orphan metrics-history
            # --orphan keeps the working tree staged; start the branch empty.
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          mkdir -p metrics
          cp "$RUNNER_TEMP/metrics.json" metrics.json
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          cp metrics.json "metrics/${TIMESTAMP}_${{ github.sha }}.json"

          python - <<'PY'
          import csv, json, os
          m = json.load(open("metrics.json", encoding="utf-8"))
          path = "metrics/history.csv"
          # E2: tests_ok + tests_exit_code distinguish a COMPLETE suite from a
          # crash-truncated one. Without them, run fda40ab's 0xC0000005 crash
          # published passed=260 as an ordinary green row and any
          # last-row-wins consumer would treat 260 as the suite size.
          HEADER = ["timestamp", "commit", "branch", "build_ok",
                    "passed", "failed", "ignored", "warnings",
                    "tests_ok", "tests_exit_code"]
          rows = []
          if os.path.exists(path):
              with open(path, newline="", encoding="utf-8") as f:
                  rows = list(csv.reader(f))
          # Schema migration: pad pre-E2 rows with EMPTY cells, never invented
          # values. The consumer's rule (P1 amend) is to reject rows without a
          # true tests_ok, so old rows - including the poisoned 260 crash row -
          # fall out of last-row-wins naturally instead of being rewritten.
          if rows and rows[0] != HEADER:
              old_len = len(rows[0])
              rows[0] = HEADER
              for r in rows[1:]:
                  r.extend([""] * (len(HEADER) - old_len))
          if not rows:
              rows = [HEADER]
          rows.append([
              m["timestamp"], m["commit"][:8], m["branch"],
              m["build"]["ok"], m["tests"]["passed"], m["tests"]["failed"],
              m["tests"]["ignored"], m["build"]["warnings"],
              m["tests"]["ok"], m["tests"]["exit_code"],
          ])
          with open(path, "w", newline="", encoding="utf-8") as f:
              csv.writer(f).writerows(rows)
          PY

          git add metrics/ metrics.json
          git commit -m "Add Windows metrics for ${{ github.sha }}" \
            || echo "No changes to commit"

          # Only master publishes. On a PR branch everything above has already
          # run — checkout, history append, commit — so a breakage surfaces in
          # review; the commit is simply discarded with the runner.
          if [ "${{ github.ref }}" = "refs/heads/master" ] \
            || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git push origin metrics-history || echo "Push failed - may need rebase"
          else
            echo "Not master — history logic exercised, push skipped."
          fi

      # ---------------------------------------------------------------------
      # Tell the umbrella there is a fresh Windows row to read.
      #
      # Only on master: master is the only ref that actually pushed to
      # metrics-history above, so pinging from a PR branch would wake the
      # umbrella to re-read a CSV that did not change.
      #
      # THREE guards, and all three are load-bearing (Atlas's macOS shape,
      # lifted with his ::warning:: refinement folded in from the start rather
      # than added afterwards):
      #
      #   1. `env.UMBRELLA_PAT != ''` — skip cleanly when the token is ABSENT
      #      instead of calling the API with an empty string.
      #   2. `continue-on-error` — covers the token being PRESENT BUT REJECTED.
      #      A revoked or expired PAT must never be able to fail a metrics run.
      #      This is the one that actually mattered on macOS: the token was set
      #      and rejected, so an absent-token guard alone would not have saved
      #      it.
      #   3. The ::warning:: below — because continue-on-error ALONE buys
      #      silence, which is the other wrong answer. The step reports
      #      conclusion=success while outcome=failure, the job goes green, and
      #      nobody learns the umbrella was never pinged. Fatal and silent are
      #      both wrong.
      - name: Trigger umbrella metrics update
        id: umbrella_dispatch
        if: success() && github.ref == 'refs/heads/master' && env.UMBRELLA_PAT != ''
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UMBRELLA_PAT }}
          repository: hiwavebrowser/hiwave
          event-type: metrics-updated
          client-payload: '{"platform": "windows", "run_id": "${{ github.run_number }}"}'

      - name: Surface a failed umbrella ping
        if: always() && steps.umbrella_dispatch.outcome == 'failure'
        run: |
          echo "::warning::Umbrella metrics dispatch FAILED — the Windows numbers"\
            " on the umbrella will be stale until this is fixed. The metrics"\
            " themselves are fine; this is the notification only. Most likely"\
            " cause is a stale or revoked UMBRELLA_PAT — rotate the credential"\
            " rather than minting a new secret."

      - name: Note when the umbrella ping was skipped
        if: success() && github.ref == 'refs/heads/master' && env.UMBRELLA_PAT == ''
        run: |
          echo "::notice::UMBRELLA_PAT not set — skipped the umbrella metrics"\
            " dispatch. The metrics themselves were collected and published."
