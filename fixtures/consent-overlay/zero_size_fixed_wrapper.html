<!DOCTYPE html>
<html><head><style>
body { margin: 0; font: 16px sans-serif; }
/* The consent manager's container: fixed, no size of its own. */
#cmp-container { position: fixed; z-index: 2147483647; }
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; }
.dialog { background: #fff; width: 400px; padding: 24px; }
.dialog button { width: 120px; height: 40px; }
</style></head>
<body>
<article><h1>Headline</h1><p>Article text under the overlay.</p></article>
<div id="cmp-container"><div class="overlay" id="overlay"><div class="dialog" role="dialog">
  <p>We use cookies.</p><button id="agree" type="button">Agree</button>
</div></div></div>
<script>
window.__heard = [];
window.__agree = document.getElementById('agree');
__agree.addEventListener('click', function () {
  __heard.push('click');
  document.getElementById('cmp-container').remove();
});
</script>
</body></html>
