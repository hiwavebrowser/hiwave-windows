<!DOCTYPE html>
<html><head><style>
body { margin: 0; font: 16px sans-serif; }
.backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2147483646;
  background: rgba(0, 0, 0, 0.5); }
.dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 2147483647; background: #fff; width: 400px; padding: 24px; }
.dialog button { width: 120px; height: 40px; }
</style></head>
<body>
<article><h1>Headline</h1><p>Article text under the overlay.</p></article>
<div class="backdrop" id="backdrop"></div>
<div class="dialog" id="dialog" role="dialog">
  <p>We use cookies.</p><button id="agree" type="button">Agree</button>
</div>
<script>
window.__heard = [];
window.__agree = document.getElementById('agree');
__agree.addEventListener('click', function () {
  __heard.push('click');
  document.getElementById('dialog').remove();
  document.getElementById('backdrop').remove();
});
</script>
</body></html>
