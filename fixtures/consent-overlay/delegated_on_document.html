<!DOCTYPE html>
<html><head><style>
body { margin: 0; font: 16px sans-serif; }
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2147483647;
  background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; }
.dialog { background: #fff; width: 400px; padding: 24px; }
.btn { display: inline-block; padding: 10px 24px; background: #06c; color: #fff; cursor: pointer; }
</style></head>
<body>
<article><h1>Headline</h1><p>Article text under the overlay.</p></article>
<div class="overlay" id="overlay"><div class="dialog" role="dialog">
  <p>We use cookies.</p>
  <div class="btn" role="button" tabindex="0" data-action="accept" id="agree"><span>Agree</span></div>
</div></div>
<script>
window.__heard = [];
window.__agree = document.getElementById('agree');
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-action]');
  if (!b) return;
  __heard.push('click:' + b.getAttribute('data-action'));
  document.getElementById('overlay').remove();
});
</script>
</body></html>
